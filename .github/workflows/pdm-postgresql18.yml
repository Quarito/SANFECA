name: ANFECA PDM - PostgreSQL 18 (aislado)

on:
  pull_request:
    paths:
      - '.github/workflows/pdm-postgresql18.yml'
      - 'app/**'
      - 'config/**'
      - 'database/**'
      - 'scripts/anfeca/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit*.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: PHP 8.4 / PostgreSQL 18 / PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      ANFECA_PDM_MODO: apagado
    steps:
      - name: Recuperar código
        uses: actions/checkout@v4

      - name: PHP 8.4 y extensiones
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, curl, zip, gd, intl, pdo_pgsql, pgsql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Dependencias y clave aislada
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate --force --no-interaction

      - name: Validación sintáctica del script de ensayo
        run: bash -n scripts/anfeca/ensayo_copia_f2.sh

      - name: Bases desechables exclusivas del runner
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE bd_anfeca_pruebas_pg'
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE bd_anfeca_desechable_pruebas_pg'

      - name: Respaldo y huellas con escritura concurrente
        run: bash scripts/anfeca/pruebas/probar_instantanea_respaldo.sh

      - name: Pruebas generales SQLite
        run: php vendor/bin/phpunit -c phpunit.xml

      - name: Obtener espacio de red de PostgreSQL desechable
        id: pgnet
        run: |
          CID=$(docker ps --filter "ancestor=postgres:18" --format '{{.ID}}' | head -n 1)
          test -n "$CID"
          PID=$(docker inspect --format '{{.State.Pid}}' "$CID")
          test "$PID" -gt 1
          echo "pid=$PID" >> "$GITHUB_OUTPUT"

      - name: Pruebas PDM PostgreSQL 18 (loopback del contenedor)
        run: >-
          sudo nsenter --target "${{ steps.pgnet.outputs.pid }}" --net --
          env DB_HOST=127.0.0.1 DB_PORT=5432 DB_USERNAME=postgres DB_PASSWORD=postgres DB_URL=''
          php vendor/bin/phpunit -c phpunit.pgsql.xml

      - name: Pruebas revisión documental PostgreSQL 18 (loopback del contenedor)
        run: >-
          sudo nsenter --target "${{ steps.pgnet.outputs.pid }}" --net --
          env DB_HOST=127.0.0.1 DB_PORT=5432 DB_USERNAME=postgres DB_PASSWORD=postgres DB_URL=''
          php vendor/bin/phpunit -c phpunit.revision-pg.xml

name: ANFECA PDM - PostgreSQL 18 (aislado)

on:
  pull_request:
    paths:
      - '.github/workflows/pdm-postgresql18.yml'
      - 'app/**'
      - 'config/**'
      - 'database/**'
      - 'scripts/anfeca/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit*.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: PHP 8.5.12 / PHP-FPM / PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      ANFECA_PDM_MODO: apagado
    steps:
      - name: Recuperar código
        uses: actions/checkout@v4

      - name: Compilar los recursos de Laravel
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci --ignore-scripts && npm run build

      - name: Preparar runtime exacto en la red del PostgreSQL desechable
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker build -f scripts/anfeca/runtime/Dockerfile.php8512 -t anfeca-ci-php:8.5.12 scripts/anfeca/runtime
          docker run -d --name anfeca-ci-php --network "container:$POSTGRES_CONTAINER" \
            --user "$(id -u):$(id -g)" --workdir /app --volume "$GITHUB_WORKSPACE:/app" \
            -e HOME=/tmp -e APP_ENV -e DB_HOST -e DB_PORT -e DB_USERNAME -e DB_PASSWORD -e ANFECA_PDM_MODO \
            --entrypoint sleep anfeca-ci-php:8.5.12 infinity
          docker exec anfeca-ci-php php -r 'if (PHP_VERSION !== "8.5.12") exit(1); echo PHP_VERSION, PHP_EOL;'
          docker exec anfeca-ci-php php-fpm -v | grep -F 'PHP 8.5.12 (fpm-fcgi)'
          cp .env.example .env
          docker exec anfeca-ci-php composer install --prefer-dist --no-interaction --no-progress
          docker exec anfeca-ci-php composer check-platform-reqs --lock
          docker exec anfeca-ci-php php artisan key:generate --force --no-interaction

      - name: Validación sintáctica del script de ensayo
        run: bash -n scripts/anfeca/ensayo_copia_f2.sh

      - name: Simular conmutación y reversión de 8086
        run: bash scripts/anfeca/pruebas/probar_conmutacion_simulada.sh "$RUNNER_TEMP/conmutacion-8086"

      - name: Bases desechables exclusivas del runner
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE bd_anfeca_pruebas_pg;
          CREATE DATABASE bd_anfeca_desechable_pruebas_pg;
          CREATE DATABASE certificacion_anfeca;
          SQL

      - name: Respaldo y huellas con escritura concurrente
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker cp scripts/anfeca "$POSTGRES_CONTAINER:/tmp/anfeca"
          docker exec -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGUSER=postgres -e PGPASSWORD=postgres \
            "$POSTGRES_CONTAINER" bash /tmp/anfeca/pruebas/probar_instantanea_respaldo.sh

      - name: Instalación Laravel y PowerDesigner en certificacion_anfeca
        run: |
          docker exec -e DB_CONNECTION=pgsql -e DB_DATABASE=certificacion_anfeca anfeca-ci-php \
            php artisan migrate --force --no-interaction
          docker exec -e DB_CONNECTION=pgsql -e DB_DATABASE=certificacion_anfeca -e ANFECA_PDM_AUTORIZAR_INSTALACION=si \
            anfeca-ci-php php artisan anfeca:modelo-instalar --ejecutar --confirmar --no-interaction
          docker exec -e DB_CONNECTION=pgsql -e DB_DATABASE=certificacion_anfeca -e ANFECA_PDM_AUTORIZAR_EXTENSIONES=si \
            anfeca-ci-php php artisan migrate --path=database/migrations_pdm --force --no-interaction
          docker exec -e DB_CONNECTION=pgsql -e DB_DATABASE=certificacion_anfeca anfeca-ci-php \
            php artisan anfeca:modelo-verificar --no-interaction

      - name: Prueba Laravel mediante el pool PHP-FPM 8.5.12
        run: >-
          docker exec -e DB_CONNECTION=pgsql -e DB_DATABASE=certificacion_anfeca
          anfeca-ci-php bash scripts/anfeca/pruebas/probar_php_fpm.sh

      - name: Pruebas generales SQLite
        run: docker exec anfeca-ci-php php vendor/bin/phpunit -c phpunit.xml

      - name: Pruebas PDM PostgreSQL 18
        run: docker exec anfeca-ci-php php vendor/bin/phpunit -c phpunit.pgsql.xml

      - name: Pruebas de revisión documental PostgreSQL 18
        run: docker exec anfeca-ci-php php vendor/bin/phpunit -c phpunit.revision-pg.xml

      - name: Retirar el runtime de pruebas
        if: always()
        run: docker rm -f anfeca-ci-php || true

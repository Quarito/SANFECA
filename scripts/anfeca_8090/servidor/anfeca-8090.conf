# VirtualHost EXCLUSIVO de ANFECA 8090 (no modifica los de 8086, 8088, 8008 ni producción).
Listen 8090

<VirtualHost *:8090>
    ServerName anfeca-8090
    DocumentRoot /var/www/ANFECA_8090/public

    <Directory /var/www/ANFECA_8090/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Nada fuera de public/ se sirve (.env, storage, vendor…).
    <DirectoryMatch "^/var/www/ANFECA_8090/(?!public)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/anfeca8090/php-fpm.sock|fcgi://localhost-anfeca8090"
    </FilesMatch>

    LimitRequestBody 26214400
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog RUTA_LOGS/anfeca8090_error.log
    CustomLog RUTA_LOGS/anfeca8090_access.log combined
</VirtualHost>

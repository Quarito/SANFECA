; Pool PHP-FPM EXCLUSIVO del ambiente 8090 (no comparte socket ni proceso con 8086).
[global]
pid = /run/anfeca8090/php-fpm.pid
error_log = /var/log/anfeca8090/php-fpm.log

[anfeca8090]
user = USUARIO_WEB
group = GRUPO_WEB
listen = /run/anfeca8090/php-fpm.sock
listen.owner = USUARIO_WEB
listen.group = GRUPO_WEB
listen.mode = 0660
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
php_admin_value[error_log] = /var/log/anfeca8090/php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off

[global]
error_log = /proc/self/fd/2

[anfeca8088]
user = anfeca8088
group = anfeca8088
listen = /run/anfeca8088-fpm/php.sock
listen.owner = anfeca8088
listen.group = apache
listen.mode = 0660
pm = ondemand
pm.max_children = 4
clear_env = yes
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/www/ANFECA_8088/storage/logs/php-fpm.log
php_admin_value[session.save_path] = /var/www/ANFECA_8088/storage/framework/sessions
php_admin_value[upload_tmp_dir] = /var/www/ANFECA_8088/storage/tmp
php_admin_value[sys_temp_dir] = /var/www/ANFECA_8088/storage/tmp

; ANFECA · mismos valores que /etc/php.d/99-server.ini del servidor (PHP-FPM 8.4.27 que atiende 8086),
; para que la actualización a PHP 8.5.12 no cambie límites, mensajes de carga ni zona horaria.
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 60
date.timezone = America/Mexico_City

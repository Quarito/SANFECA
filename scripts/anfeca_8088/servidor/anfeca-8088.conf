# VirtualHost EXCLUSIVO de ANFECA en el puerto 8088 (no modifica los de 8086, 8008 ni producción).
Listen 8088

<VirtualHost *:8088>
    ServerName anfeca-8088
    DocumentRoot /var/www/ANFECA_8088/public

    <Directory /var/www/ANFECA_8088/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Nada fuera de public/ se sirve (.env, storage, vendor…).
    <DirectoryMatch "^/var/www/ANFECA_8088/(?!public)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/anfeca8088/php-fpm.sock|fcgi://localhost-anfeca8088"
    </FilesMatch>

    LimitRequestBody 26214400
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog RUTA_LOGS/anfeca8088_error.log
    CustomLog RUTA_LOGS/anfeca8088_access.log combined
</VirtualHost>
